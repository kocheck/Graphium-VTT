name: Feature request
description: An idea that would make running your table easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do at the table?
      description: Describe the moment in a session where Graphium gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
